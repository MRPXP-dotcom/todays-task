<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --blue: #3949ab;
    --green: #3d9b7d;
    --green-bg: #edf8f5;
    --green-border: #b8ddd3;
    --red: #d94b43;
    --red-bg: #fff0f0;
    --red-border: #efbaba;
    --dark: #202b43;
    --muted: #69738b;
    --border: #e4e1d9;
    --cream: #f7f4ea;
}

body {
    min-height: 100vh;
    padding: clamp(14px, 3vw, 32px);
    background: var(--cream);
    color: var(--dark);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    transition: background .25s ease, color .25s ease;
}

.app {
    width: min(100%, 800px);
    min-height: calc(100vh - clamp(28px, 6vw, 64px));
    margin: auto;
    padding: clamp(24px, 5vw, 42px);
    background: #fff;
    border: 2px solid #e6e2d9;
    border-radius: clamp(28px, 5vw, 48px);

    transition: background .25s ease, border-color .25s ease;
}

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding-bottom: clamp(22px, 4vw, 34px);
    border-bottom: 2px solid #e5e1d8;
}

.title {
    color: var(--blue);
    font-size: clamp(28px, 5vw, 46px);
    font-weight: 800;
    line-height: 1.1;
}

.header-controls {
    display: flex;
    align-items: center;
    gap: 8px;
}

.lang {
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 48px;
    padding: 0 20px;
    border: 2px solid #e5e1d8;
    border-radius: 30px;
    background: #fafafa;
    color: var(--dark);
    font-size: clamp(15px, 2.5vw, 20px);
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
}

/* زر الوضع الليلي */
.theme-btn {
    width: 48px;
    height: 48px;
    display: grid;
    place-items: center;
    border: 2px solid #e5e1d8;
    border-radius: 50%;
    background: #fafafa;
    color: var(--dark);
    cursor: pointer;
    transition: background .25s ease,
                color .25s ease,
                border-color .25s ease;
}

.theme-btn svg {
    width: 24px;
    height: 24px;
    fill: currentColor;
}

.add-area {
    margin: clamp(24px, 4vw, 42px) 0;
}

.add-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    min-height: 72px;
    padding: 0 32px;
    border: 0;
    border-radius: 25px;
    background: var(--blue);
    color: #fff;
    font-size: clamp(19px, 3vw, 26px);
    font-weight: 700;
    cursor: pointer;
}

.plus {
    font-size: 34px;
    font-weight: 300;
    line-height: 1;
}

.input-area {
    display: none;
    flex-direction: column;
    gap: 12px;
    margin-top: 14px;
}

.input-area.show {
    display: flex;
}

.input-row {
    display: flex;
    gap: 10px;
}

.datetime-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.datetime-row input {
    flex: 1;
    min-width: 130px;
    height: 46px;
    padding: 0 12px;
    border: 2px solid var(--border);
    border-radius: 14px;
    outline: none;
    color: var(--dark);
    background: #fff;
    font-size: 15px;
    transition: background .25s ease, color .25s ease, border-color .25s ease;
}

.datetime-row input:focus {
    border-color: var(--blue);
}

.task-input {
    flex: 1;
    min-width: 0;
    height: 58px;
    padding: 0 18px;
    border: 2px solid var(--border);
    border-radius: 18px;
    outline: none;
    color: var(--dark);
    background: #fff;
    font-size: 17px;

    transition: background .25s ease,
                color .25s ease,
                border-color .25s ease;
}

.task-input:focus {
    border-color: var(--blue);
}

.save-btn {
    min-width: 90px;
    border: 0;
    border-radius: 18px;
    background: var(--green);
    color: white;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
}

.empty {
    padding: 70px 20px;
    text-align: center;
    color: var(--muted);
    font-size: clamp(19px, 3vw, 27px);
}

.tasks {
    display: flex;
    flex-direction: column;
    gap: 18px;
}

.task {
    display: grid;
    grid-template-columns: 58px 1fr auto;
    align-items: center;
    gap: clamp(12px, 2vw, 22px);
    min-height: 128px;
    padding: 18px 20px;
    border: 2px solid;
    border-radius: 28px;
    transition: .2s ease;
}

.task.done {
    background: var(--green-bg);
    border-color: var(--green-border);
}

.task.failed {
    background: var(--red-bg);
    border-color: var(--red-border);
}

/* الترقيم */
.task-number {
    width: 58px;
    height: 58px;
    display: grid;
    place-items: center;
    border-radius: 18px;
    background: rgba(255,255,255,.65);
    color: var(--muted);
    font-size: 23px;
    font-weight: 700;

    direction: ltr;
    unicode-bidi: isolate;
    text-align: center;
    cursor: pointer;
    user-select: none;
    transition: background .2s ease, color .2s ease;
}

.task-number:hover {
    background: var(--blue);
    color: white;
}

.task-content-wrapper {
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.task-text {
    min-width: 0;
    color: var(--dark);
    font-size: clamp(18px, 3vw, 27px);
    font-weight: 600;
    line-height: 1.35;
    overflow-wrap: anywhere;
    user-select: none;
}

.task-datetime {
    font-size: 13px;
    color: var(--muted);
    font-weight: 500;
    direction: ltr;
    text-align: right;
}

html[dir="ltr"] .task-datetime {
    text-align: left;
}

.task.done .task-text {
    color: var(--green);
    text-decoration: line-through;
    text-decoration-thickness: 2px;
}

.actions {
    display: flex;
    align-items: center;
    gap: 10px;
}

.state-btn {
    width: 72px;
    height: 72px;
    flex: 0 0 72px;
    display: grid;
    place-items: center;
    border: 2px solid #e5e1d8;
    border-radius: 22px;
    background: transparent;
    color: #68728c;
    font-size: 39px;
    font-weight: 300;
    line-height: 1;
    cursor: pointer;
}

.state-btn.check.active {
    background: var(--green);
    border-color: var(--green);
    color: white;
}

.state-btn.cross.active {
    background: var(--red);
    border-color: var(--red);
    color: white;
}

.delete {
    width: 54px;
    height: 54px;
    flex: 0 0 54px;
    display: grid;
    place-items: center;
    border: 0;
    background: transparent;
    color: var(--red);
    cursor: pointer;
}

.delete svg {
    width: 34px;
    height: 34px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2.3;
    stroke-linecap: round;
    stroke-linejoin: round;
}

html[dir="ltr"] .task {
    grid-template-columns: auto 1fr 58px;
}

html[dir="ltr"] .task-number {
    grid-column: 3;
}

html[dir="ltr"] .task-content-wrapper {
    grid-column: 2;
}

html[dir="ltr"] .actions {
    grid-column: 1;
    grid-row: 1;
}


/* نافذة منبثقة لتحديد الوقت والتاريخ عند الضغط على رقم المهمة */
.modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.5);
    display: grid;
    place-items: center;
    z-index: 1000;
    padding: 20px;
}

.modal-content {
    background: #fff;
    padding: 24px;
    border-radius: 24px;
    width: min(100%, 400px);
    display: flex;
    flex-direction: column;
    gap: 16px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

.modal-content h3 {
    color: var(--blue);
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 4px;
}

.modal-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    margin-top: 10px;
}

.modal-btn {
    padding: 10px 20px;
    border-radius: 14px;
    border: 0;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
}

.modal-btn.save {
    background: var(--green);
    color: white;
}

.modal-btn.cancel {
    background: #e5e1d8;
    color: var(--dark);
}


/* =========================================================
   الوضع الليلي
   ========================================================= */

html.dark {
    --dark: #edf1f7;
    --muted: #aeb7c8;
    --border: #3a4355;
    --cream: #111722;
}

html.dark body {
    background: #111722;
    color: #edf1f7;
}

html.dark .app {
    background: #1a2130;
    border-color: #30394b;
}

html.dark .header {
    border-bottom-color: #30394b;
}

html.dark .lang,
html.dark .theme-btn {
    background: #222b3c;
    border-color: #3a4355;
    color: #edf1f7;
}

html.dark .task-input,
html.dark .datetime-row input,
html.dark .modal-content {
    background: #202938;
    border-color: #3a4355;
    color: #edf1f7;
}

html.dark .modal-content {
    background: #1a2130;
    border: 1px solid #3a4355;
}

html.dark .task-input:focus,
html.dark .datetime-row input:focus {
    border-color: var(--blue);
}

html.dark .task-number {
    background: rgba(255,255,255,.12);
    color: #edf1f7;
}

html.dark .task-number:hover {
    background: var(--blue);
    color: #fff;
}

html.dark .task.done .task-number {
    background: rgba(255,255,255,.65);
    color: #202b43;
}

html.dark .task.failed .task-number {
    background: rgba(255,255,255,.65);
    color: #202b43;
}

html.dark .task.failed .task-text {
    color: #202b43 !important;
}

html.dark .state-btn {
    border-color: #3a4355;
    color: #9da9c0;
}

html.dark .modal-btn.cancel {
    background: #3a4355;
    color: #edf1f7;
}


/* =========================================================
   الهاتف
   ========================================================= */

@media (max-width: 600px) {

    body {
        padding: 10px;
    }

    .app {
        min-height: calc(100vh - 20px);
        padding: 22px 16px;
        border-radius: 28px;
    }

    .header {
        gap: 10px;
    }

    .header-controls {
        gap: 5px;
    }

    .lang {
        min-height: 42px;
        padding: 0 14px;
        font-size: 14px;
    }

    .theme-btn {
        width: 42px;
        height: 42px;
    }

    .add-btn {
        width: 100%;
        min-height: 62px;
        border-radius: 21px;
    }

    .task {
        grid-template-columns: 44px 1fr auto;
        gap: 9px;
        min-height: 104px;
        padding: 13px;
        border-radius: 22px;
    }

    .task-number {
        width: 44px;
        height: 44px;
        border-radius: 14px;
        font-size: 18px;
    }

    .actions {
        gap: 5px;
    }

    .state-btn {
        width: 52px;
        height: 52px;
        flex-basis: 52px;
        border-radius: 16px;
        font-size: 30px;
    }

    .delete {
        width: 42px;
        height: 42px;
        flex-basis: 42px;
    }

    .delete svg {
        width: 28px;
        height: 28px;
    }

    html[dir="ltr"] .task {
        grid-template-columns: auto 1fr 44px;
    }

    .input-area {
        flex-direction: column;
    }

    .input-row {
        flex-direction: column;
    }

    .task-input,
    .save-btn {
        width: 100%;
        min-height: 54px;
    }
}
</style>
</head>

<body>

<main class="app">

    <header class="header">

        <h1 class="title" id="title">
            <span style="color: #ffffff; text-shadow: 0 0 2px rgba(0,0,0,0.3);">Daily</span> 
            <span style="color: var(--blue);">Mission</span>
        </h1>

        <div class="header-controls">

            <button class="lang" id="langBtn">
                <span id="langText">English</span>
                <span>文A</span>
            </button>

            <button
                class="theme-btn"
                id="themeBtn"
                aria-label="الوضع الليلي"
            >
            </button>

        </div>

    </header>

    <section class="add-area">

        <button class="add-btn" id="addBtn">
            <span class="plus">＋</span>
            <span id="addText">أضف مهمة</span>
        </button>

        <div class="input-area" id="inputArea">

            <div class="input-row">
                <input
                    id="taskInput"
                    class="task-input"
                    type="text"
                    autocomplete="off"
                    placeholder="اكتب المهمة..."
                >

                <button class="save-btn" id="saveBtn">
                    إضافة
                </button>
            </div>

        </div>

    </section>

    <section id="taskList" class="tasks"></section>

    <div id="empty" class="empty">
        أضف أول مهمة لك
    </div>

</main>

<script>

const root = document.getElementById("root");
const title = document.getElementById("title");
const langBtn = document.getElementById("langBtn");
const langText = document.getElementById("langText");
const addBtn = document.getElementById("addBtn");
const addText = document.getElementById("addText");
const inputArea = document.getElementById("inputArea");
const taskInput = document.getElementById("taskInput");
const saveBtn = document.getElementById("saveBtn");
const taskList = document.getElementById("taskList");
const empty = document.getElementById("empty");
const themeBtn = document.getElementById("themeBtn");


let lang = localStorage.getItem("language") || "ar";

let tasks;

try {

    tasks = JSON.parse(
        localStorage.getItem("tasks") || "[]"
    );

    if (!Array.isArray(tasks)) {
        tasks = [];
    }

} catch {

    tasks = [];

}

let darkMode =
    localStorage.getItem("darkMode") === "true";


const text = {

    ar: {
        title: `<span style="color: var(--dark);">Daily</span> <span style="color: var(--blue);">Mission</span>`,
        titleText: "Daily Mission",
        language: "English",
        add: "أضف مهمة",
        input: "اكتب المهمة...",
        save: "إضافة",
        empty: "أضف أول مهمة لك",
        modalTitle: "تحديد الوقت والتاريخ",
        modalSave: "حفظ",
        modalCancel: "إلغاء"
    },

    en: {
        title: `<span style="color: var(--dark);">Daily</span> <span style="color: var(--blue);">Mission</span>`,
        titleText: "Daily Mission",
        language: "العربية",
        add: "Add task",
        input: "Write your task...",
        save: "Add",
        empty: "Add your first task",
        modalTitle: "Set Date & Time",
        modalSave: "Save",
        modalCancel: "Cancel"
    }

};


function save() {

    localStorage.setItem(
        "tasks",
        JSON.stringify(tasks)
    );

    localStorage.setItem(
        "language",
        lang
    );

    localStorage.setItem(
        "darkMode",
        darkMode
    );

}


function applyTheme() {

    root.classList.toggle(
        "dark",
        darkMode
    );

    if (darkMode) {
        themeBtn.innerHTML = `
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="5" fill="currentColor"/>
                <path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2m-4.22-7.78l-1.42 1.42M6.34 17.66l-1.42 1.42" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
        `;
    } else {
        themeBtn.innerHTML = `
            <svg viewBox="0 0 24 24">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="currentColor"/>
            </svg>
        `;
    }

}


// نظام تشغيل الصوت (النغمة الأساسية للمشروع عبر Web Audio API)
function playAlarmSound() {
    try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        [523.25, 659.25, 783.99].forEach((freq, idx) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = "triangle";
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.15);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime + idx * 0.15);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + idx * 0.15 + 0.6);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(audioCtx.currentTime + idx * 0.15);
            osc.stop(audioCtx.currentTime + idx * 0.15 + 0.6);
        });
    } catch (e) {
        console.log("Audio play failed", e);
    }
}

// فحص أوقات المهام كل ثانية لتشغيل النغمة الأساسية عند حلول الوقت
setInterval(() => {
    if (!tasks || tasks.length === 0) return;
    const now = new Date();
    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, '0');
    const day = String(now.getDate()).padStart(2, '0');
    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');
    
    const currentDateStr = `${year}-${month}-${day}`;
    const currentTimeStr = `${hours}:${minutes}`;

    tasks.forEach((task) => {
        if (!task.notified && task.date && task.time && task.status !== "done" && task.status !== "failed") {
            if (task.date === currentDateStr && task.time === currentTimeStr) {
                playAlarmSound();
                task.notified = true;
                save();
            }
        }
    });
}, 1000);


function render() {

    root.dir =
        lang === "ar"
            ? "rtl"
            : "ltr";

    root.lang = lang;

    title.innerHTML =
        text[lang].title;

    langText.textContent =
        text[lang].language;

    addText.textContent =
        text[lang].add;

    taskInput.placeholder =
        text[lang].input;

    saveBtn.textContent =
        text[lang].save;

    empty.textContent =
        text[lang].empty;


    taskList.innerHTML = "";

    empty.style.display =
        tasks.length
            ? "none"
            : "block";


    tasks.forEach((task, index) => {

        const item =
            document.createElement("article");


        item.className =
            "task " +
            (
                task.status === "done"
                    ? "done"
                    : task.status === "failed"
                        ? "failed"
                        : ""
            );


        let dateTimeDisplay = "";
        if (task.date || task.time) {
            dateTimeDisplay = `<div class="task-datetime">${task.date || ""} ${task.time || ""}</div>`;
        }


        item.innerHTML = `

            <div class="task-number" title="اضغط لتحديد الوقت والتاريخ">
                ${index + 1}
            </div>

            <div class="task-content-wrapper">
                <div class="task-text"></div>
                ${dateTimeDisplay}
            </div>

            <div class="actions">

                <button
                    class="state-btn cross ${
                        task.status === "failed"
                            ? "active"
                            : ""
                    }"
                    data-action="failed"
                >
                    ×
                </button>

                <button
                    class="state-btn check ${
                        task.status === "done"
                            ? "active"
                            : ""
                    }"
                    data-action="done"
                >
                    ✓
                </button>

                <button
                    class="delete"
                    data-action="delete"
                >

                    <svg viewBox="0 0 24 24">

                        <path d="M4 7h16"/>
                        <path d="M9 7V4h6v3"/>
                        <path d="M6 7l1 13h10l1-13"/>
                        <path d="M10 11v5"/>
                        <path d="M14 11v5"/>

                    </svg>

                </button>

            </div>
        `;


        const numberDiv = item.querySelector(".task-number");
        numberDiv.addEventListener("click", () => {
            // فتح نافذة منبثقة لتحديد الوقت والتاريخ فقط بدون نغمة
            const overlay = document.createElement("div");
            overlay.className = "modal-overlay";
            overlay.innerHTML = `
                <div class="modal-content">
                    <h3>${text[lang].modalTitle}</h3>
                    <div class="datetime-row" style="flex-direction: column;">
                        <input type="date" id="modalDate" value="${task.date || ""}">
                        <input type="time" id="modalTime" value="${task.time || ""}">
                    </div>
                    <div class="modal-actions">
                        <button class="modal-btn cancel" id="modalCancel">${text[lang].modalCancel}</button>
                        <button class="modal-btn save" id="modalSave">${text[lang].modalSave}</button>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);

            const modalDate = overlay.querySelector("#modalDate");
            const modalTime = overlay.querySelector("#modalTime");

            overlay.querySelector("#modalCancel").onclick = () => overlay.remove();
            overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };

            overlay.querySelector("#modalSave").onclick = () => {
                tasks[index].date = modalDate.value || "";
                tasks[index].time = modalTime.value || "";
                tasks[index].notified = false; // إعادة ضبط التنبيه في حال تغير الوقت
                save();
                render();
                overlay.remove();
            };
        });


        const textDiv = item.querySelector(".task-text");
        textDiv.textContent = task.text;

        // ميزة التعديل المزدوج فقط عندما لا توجد علامة صح أو خطأ
        textDiv.addEventListener("dblclick", () => {
            if (task.status === "done" || task.status === "failed") {
                return;
            }

            const currentText = task.text;
            const inputField = document.createElement("input");
            inputField.type = "text";
            inputField.value = currentText;
            inputField.className = "task-input";
            inputField.style.height = "42px";
            inputField.style.fontSize = "inherit";

            textDiv.replaceWith(inputField);
            inputField.focus();

            const saveEdit = () => {
                const newText = inputField.value.trim();
                if (newText) {
                    tasks[index].text = newText;
                    save();
                }
                render();
            };

            inputField.addEventListener("blur", saveEdit);
            inputField.addEventListener("keydown", (e) => {
                if (e.key === "Enter") {
                    saveEdit();
                } else if (e.key === "Escape") {
                    render();
                }
            });
        });


        item.querySelectorAll(
            "[data-action]"
        ).forEach(button => {

            button.onclick = () => {

                const action =
                    button.dataset.action;


                if (action === "delete") {

                    tasks.splice(
                        index,
                        1
                    );

                } else {

                    tasks[index].status =
                        tasks[index].status === action
                            ? ""
                            : action;

                }


                save();

                render();

            };

        });


        taskList.appendChild(item);

    });


    applyTheme();

}


langBtn.onclick = () => {

    lang =
        lang === "ar"
            ? "en"
            : "ar";

    save();

    render();

};


addBtn.onclick = () => {

    inputArea.classList.toggle("show");

    if (
        inputArea.classList.contains("show")
    ) {

        taskInput.focus();

    }

};


saveBtn.onclick = () => {

    if (!taskInput.value.trim()) {

        taskInput.focus();

        return;

    }


    tasks.push({

        text:
            taskInput.value.trim(),

        status: "",
        date: "",
        time: "",
        notified: false

    });


    taskInput.value = "";

    inputArea.classList.remove(
        "show"
    );


    save();

    render();

};


taskInput.addEventListener(
    "keydown",
    e => {

        if (e.key === "Enter") {

            saveBtn.onclick();

        }

        if (e.key === "Escape") {

            inputArea.classList.remove(
                "show"
            );

            taskInput.value = "";

        }

    }
);


themeBtn.onclick = () => {

    darkMode =
        !darkMode;

    save();

    applyTheme();

};


render();

</script>

</body>
</html>
