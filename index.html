DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Mission</title>
    <style>
        body { background-color: #f9f7f2; font-family: sans-serif; display: flex; justify-content: center; padding: 20px; }
        .container { background: white; width: 100%; max-width: 400px; padding: 20px; border-radius: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #2c3e50; }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 10px; }
        button#add-btn { padding: 10px 20px; background: #394480; color: white; border: none; border-radius: 10px; cursor: pointer; }
        .task-item { display: flex; align-items: center; padding: 10px; border-bottom: 1px solid #eee; gap: 5px; }
        .task-text { flex: 1; }
        .completed { text-decoration: line-through; color: gray; }
        .btn-action { border: none; background: none; cursor: pointer; font-size: 1.2rem; }
    </style>
</head>
<body>

<div class="container">
    <h1>Daily Mission</h1>
    <div class="input-group">
        <input type="text" id="task-input" placeholder="أضف مهمة جديدة...">
        <button id="add-btn">إضافة</button>
    </div>
    <div id="task-list"></div>
</div>

<script>
    const input = document.getElementById('task-input');
    const btn = document.getElementById('add-btn');
    const list = document.getElementById('task-list');

    btn.onclick = () => {
        if (!input.value) return;
        const div = document.createElement('div');
        div.className = 'task-item';
        div.innerHTML = `
            <span class="task-text">${input.value}</span>
            <button class="btn-action" onclick="toggleTask(this, true)">✔️</button>
            <button class="btn-action" onclick="toggleTask(this, false)">❌</button>
            <button class="btn-action" onclick="this.parentElement.remove()">🗑️</button>
        `;
        list.appendChild(div);
        input.value = '';
    };

    function toggleTask(btn, isDone) {
        const text = btn.parentElement.querySelector('.task-text');
        isDone ? text.classList.add('completed') : text.classList.remove('completed');
    }
</script>

</body>
</html>
