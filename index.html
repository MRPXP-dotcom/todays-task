<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Today's Task - إدارة المهام اليومية</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            width: 100%;
            max-width: 450px;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }
        h1 {
            font-size: 1.5rem;
            color: #2c3e50;
            margin-bottom: 10px;
            text-align: center;
        }
        p.subtitle {
            font-size: 0.9rem;
            color: #7f8c8d;
            text-align: center;
            margin-bottom: 20px;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            border-color: #3498db;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 8px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #2980b9;
        }
        ul {
            list-style: none;
        }
        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f9f9f9;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid #eee;
            transition: all 0.2s;
        }
        li.completed {
            background: #e8f8f5;
            border-color: #a3e4d7;
            text-decoration: line-through;
            color: #7f8c8d;
        }
        .task-text {
            flex: 1;
            cursor: pointer;
            word-break: break-word;
        }
        .delete-btn {
            background: transparent;
            color: #e74c3c;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .delete-btn:hover {
            color: #c0392b;
            background: transparent;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>مرحباً بك في مهمة اليوم</h1>
        <p class="subtitle">تطبيق بسيط ومنظم لإدارة مهامك اليومية بدون تواريخ. أضف مهمتك، ضع علامة صح عند الإنجاز، أو احذفها عند التعثر.</p>
        
        <div class="input-group">
            <input type="text" id="taskInput" placeholder="أضف مهمة جديدة...">
            <button id="addBtn">إضافة</button>
        </div>

        <ul id="taskList"></ul>
    </div>

    <script>
        const taskInput = document.getElementById('taskInput');
        const addBtn = document.getElementById('addBtn');
        const taskList = document.getElementById('taskList');

        function addTask() {
            const taskText = taskInput.value.trim();
            if (taskText === '') return;

            const li = document.createElement('li');
            
            const span = document.createElement('span');
            span.className = 'task-text';
            span.textContent = taskText;
            span.addEventListener('click', () => {
                li.classList.toggle('completed');
            });

            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'delete-btn';
            deleteBtn.textContent = 'حذف';
            deleteBtn.addEventListener('click', () => {
                li.remove();
            });

            li.appendChild(span);
            li.appendChild(deleteBtn);
            taskList.appendChild(li);

            taskInput.value = '';
        }

        addBtn.addEventListener('click', addTask);
        taskInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                addTask();
            }
        });
    </script>
</body>
</html>
