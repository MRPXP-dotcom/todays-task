<!DOCTYPE html>
<html lang="ar" dir="rtl" id="root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مهمة اليوم</title>

<!-- الأيقونات -->
<link rel="icon" type="image/png" sizes="32x32" href="9368C532-D833-4080-AB32-CC3CEBB9E3B8.png">
<link rel="apple-touch-icon" sizes="180x180" href="9368C532-D833-4080-AB32-CC3CEBB9E3B8.png">

<style>
:root {
    --bg: #ffffff;
    --text: #202b43;
    --accent: #3949ab;
    --border: #e4e1d9;
    --green: #3d9b7d;
    --red: #d94b43;
}
body.dark-mode {
    --bg: #1a1a1a;
    --text: #e0e0e0;
    --accent: #5c6bc0;
    --border: #333333;
}
body { background: var(--bg); color: var(--text); font-family: sans-serif; padding: 20px; transition: 0.3s; }
.app { width: min(100%, 800px); margin: auto; padding: 30px; border: 2px solid var(--border); border-radius: 30px; }
.header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 2px solid var(--border); }
.controls { display: flex; gap: 10px; }
.btn { padding: 10px 20px; border: 1px solid var(--border); border-radius: 20px; background: var(--bg); color: var(--text); cursor: pointer; }
.add-area { margin: 30px 0; }
.add-btn { width: 100%; padding: 20px; border: 0; border-radius: 20px; background: var(--accent); color: white; font-weight: bold; cursor: pointer; }
.input-area { display: none; flex-direction: column; gap: 10px; margin-top: 15px; }
.input-area.show { display: flex; }
input { width: 100%; padding: 15px; border: 1px solid var(--border); border-radius: 15px; background: var(--bg); color: var(--text); }
.save-btn { padding: 15px; border: 0; border-radius: 15px; background: var(--green); color: white; cursor: pointer; }
.task { display: grid; grid-template-columns: 50px 1fr auto; align-items: center; gap: 15px; padding: 15px; border-bottom: 1px solid var(--border); }
</style>
</head>

<body>
<main class="app">
    <header class="header">
        <h1 id="title">مهمة اليوم</h1>
        <div class="controls">
            <button class="btn" id="themeBtn">تبديل المظهر</button>
            <button class="btn" id="langBtn">English</button>
        </div>
    </header>
    <section class="add-area">
        <button class="add-btn" id="addBtn">إضافة مهمة</button>
        <div class="input-area" id="inputArea">
            <input id="taskInput" type="text" placeholder="اكتب المهمة...">
            <input id="dateInput" type="datetime-local">
            <button class="save-btn" id="saveBtn">حفظ</button>
        </div>
    </section>
    <section id="taskList"></section>
</main>

<script>
const themeBtn = document.getElementById("themeBtn");
const langBtn = document.getElementById("langBtn");
const addBtn = document.getElementById("addBtn");
const inputArea = document.getElementById("inputArea");
const saveBtn = document.getElementById("saveBtn");
const taskList = document.getElementById("taskList");

let isDark = localStorage.getItem("darkMode") === "true";
if (isDark) document.body.classList.add("dark-mode");

themeBtn.onclick = () => {
    isDark = !isDark;
    document.body.classList.toggle("dark-mode", isDark);
    localStorage.setItem("darkMode", isDark);
};

addBtn.onclick = () => inputArea.classList.toggle("show");

saveBtn.onclick = () => {
    const text = document.getElementById("taskInput").value;
    const date = document.getElementById("dateInput").value;
    if (!text) return;
    const task = { text, date };
    let tasks = JSON.parse(localStorage.getItem("tasks") || "[]");
    tasks.push(task);
    localStorage.setItem("tasks", JSON.stringify(tasks));
    render();
    document.getElementById("taskInput").value = "";
    inputArea.classList.remove("show");
};

function render() {
    taskList.innerHTML = "";
    const tasks = JSON.parse(localStorage.getItem("tasks") || "[]");
    tasks.forEach((t, i) => {
        taskList.innerHTML += `<div class="task">
            <div>${i + 1}</div>
            <div>${t.text}<br><small>${t.date || ""}</small></div>
            <button class="btn" onclick="deleteTask(${i})">حذف</button>
        </div>`;
    });
}
function deleteTask(i) {
    let tasks = JSON.parse(localStorage.getItem("tasks") || "[]");
    tasks.splice(i, 1);
    localStorage.setItem("tasks", JSON.stringify(tasks));
    render();
}
render();
</script>
</body>
</html>
