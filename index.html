<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مهمة اليوم - Today's Task</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --btn-bg: #5c6bc0;
            --btn-hover: #3f51b5;
            --border-color: #2c2c2c;
            --danger-bg: #2a1a1a;
            --danger-text: #ff5252;
        }

        [data-theme="light"] {
            --bg-color: #f4f4f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --btn-bg: #4f46e5;
            --btn-hover: #4338ca;
            --border-color: #e5e7eb;
            --danger-bg: #fee2e2;
            --danger-text: #dc2626;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 450px;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            box-sizing: border-box;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0;
        }

        .controls {
            display: flex;
            gap: 8px;
        }

        .icon-btn, .lang-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .icon-btn:hover, .lang-btn:hover {
            background-color: rgba(128, 128, 128, 0.1);
        }

        .main-btn {
            width: 100%;
            background-color: var(--btn-bg);
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            margin-bottom: 20px;
            transition: background-color 0.2s;
        }

        .main-btn:hover {
            background-color: var(--btn-hover);
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .task-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background-color: rgba(128, 128, 128, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 10px;
        }

        .task-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .task-text {
            font-size: 1rem;
            font-weight: 500;
        }

        .task-time {
            font-size: 0.75rem;
            opacity: 0.7;
        }

        .delete-btn {
            background-color: var(--danger-bg);
            color: var(--danger-text);
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85srem;
        }

        .delete-btn:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body data-theme="dark">

    <div class="container">
        <div class="header">
            <h1 id="app-title">مهمة اليوم</h1>
            <div class="controls">
                <button class="lang-btn" id="langToggle" onclick="toggleLanguage()">EN</button>
                <button class="icon-btn" id="themeToggle" onclick="toggleTheme()">☀️</button>
            </div>
        </div>

        <button class="main-btn" id="addBtn" onclick="addTask()">إضافة مهمة</button>

        <div class="task-list" id="taskList">
            <!-- سيتم إدراج المهام هنا -->
        </div>
    </div>

    <script>
        let currentLang = 'ar';
        let tasks = [
            { id: 1, text: 'عمل', time: '12/08/2026 - 09:28 ص' },
            { id: 2, text: 'تطوير', time: '16/08/2026 - 01:31 م' }
        ];

        function render() {
            // تحديث النصوص بناءً على اللغة
            document.getElementById('app-title').innerText = currentLang === 'ar' ? 'مهمة اليوم' : "Today's Task";
            document.getElementById('addBtn').innerText = currentLang === 'ar' ? 'إضافة مهمة' : 'Add Task';
            document.getElementById('langToggle').innerText = currentLang === 'ar' ? 'EN' : 'AR';
            document.documentElement.setAttribute('dir', currentLang === 'ar' ? 'rtl' : 'ltr');

            // عرض المهام
            const listEl = document.getElementById('taskList');
            listEl.innerHTML = '';
            
            tasks.forEach((task, index) => {
                const item = document.createElement('div');
                item.className = 'task-item';
                item.innerHTML = `
                    <div class="task-info">
                        <span class="task-text">${task.text}</span>
                        <span class="task-time">${task.time}</span>
                    </div>
                    <button class="delete-btn" onclick="deleteTask(${task.id})">${currentLang === 'ar' ? 'حذف' : 'Delete'}</button>
                `;
                listEl.appendChild(item);
            });
        }

        function toggleTheme() {
            const body = document.body;
            const themeBtn = document.getElementById('themeToggle');
            if (body.getAttribute('data-theme') === 'dark') {
                body.setAttribute('data-theme', 'light');
                themeBtn.innerText = '🌙';
            } else {
                body.setAttribute('data-theme', 'dark');
                themeBtn.innerText = '☀️';
            }
        }

        function toggleLanguage() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            render();
        }

        function addTask() {
            const textPrompt = currentLang === 'ar' ? 'أدخل اسم المهمة:' : 'Enter task name:';
            const taskText = prompt(textPrompt);
            if (taskText) {
                const now = new Date();
                const hours = now.getHours();
                const minutes = String(now.getMinutes()).padStart(2, '0');
                const ampm = hours >= 12 ? (currentLang === 'ar' ? 'م' : 'PM') : (currentLang === 'ar' ? 'ص' : 'AM');
                const formattedHours = String(hours % 12 || 12).padStart(2, '0');
                const day = String(now.getDate()).padStart(2, '0');
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const year = now.getFullYear();
                
                const timeString = `${day}/${month}/${year} - ${formattedHours}:${minutes} ${ampm}`;
                
                tasks.push({
                    id: Date.now(),
                    text: taskText,
                    time: timeString
                });
                render();
            }
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            render();
        }

        // التهيئة الأولية
        render();
    </script>
</body>
</html>
